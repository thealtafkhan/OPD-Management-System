spring.application.name=opd-management-system
server.port=8080

# Live PostgreSQL Database Configuration
spring.datasource.url=jdbc:postgresql://localhost:5432/opd_db
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true

# File Upload Settings
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# JWT Configuration
app.jwt.secret=9a6747b9e1b55933616e248bc76839f1a4b51e447ff8154e93874d1b5a7942e6
app.jwt.expiration-ms=86400000

# File Storage Directory
app.upload.dir=./uploads

