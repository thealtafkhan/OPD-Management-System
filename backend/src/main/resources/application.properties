spring.application.name=opd-management-system
server.port=${PORT:8080}

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:opd_db}}
spring.datasource.driverClassName=org.postgresql.Driver
spring.datasource.username=${DB_USER:${SPRING_DATASOURCE_USERNAME:postgres}}
spring.datasource.password=${DB_PASSWORD:${SPRING_DATASOURCE_PASSWORD:Altaf@64420}}
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# File Upload Settings
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# JWT Configuration
app.jwt.secret=${JWT_SECRET:9a6747b9e1b55933616e248bc76839f1a4b51e447ff8154e93874d1b5a7942e6}
app.jwt.expiration-ms=86400000

# File Storage Directory
app.upload.dir=./uploads

